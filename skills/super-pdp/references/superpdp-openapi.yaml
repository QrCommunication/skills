          $ref: "#/components/schemas/additional_reference_previous_invoice_line"
        allowances:
          description: >-
            BG-27


            A group of business terms providing information about allowances
            applicable to the individual Invoice line.
          items:
            $ref: "#/components/schemas/invoice_line_allowance_or_charge"
          type: array
        buyer_accounting_reference:
          description: >-
            BT-133


            Invoice line Buyer accounting reference

            A textual value that specifies where to book the relevant data into
            the Buyer's financial accounts.

            If required, this reference shall be provided by the Buyer to the
            Seller prior to the issuing of the Invoice.
          type: string
        charges:
          description: >-
            BG-28


            A group of business terms providing information about charges and
            taxes other than VAT applicable to the individual Invoice line.

            All charges and taxes are assumed to be liable to the same VAT rate
            as the Invoice line.
          items:
            $ref: "#/components/schemas/invoice_line_allowance_or_charge"
          type: array
        delivery_address:
          $ref: "#/components/schemas/line_delivery_address"
        identifier:
          description: |-
            BT-126

            Invoice line identifier
            A unique identifier for the individual line within the Invoice.
          type: string
        invoiced_quantity:
          description: >-
            BT-129


            Invoiced quantity

            The quantity of items (goods or services) that is charged in the
            Invoice line.
          format: decimal
          type: string
        invoiced_quantity_code:
          $ref: "#/components/schemas/unit_code"
        item_information:
          $ref: "#/components/schemas/item_information"
        line_vat_accounting_currency:
          description: |-
            EXT-FR-FE-182-1

            Accounting currency for the VAT Amount of the invoice line
          type: string
        line_vat_amount:
          description: |-
            EXT-FR-FE-181

            VAT amount of invoice line in invoice currency
          format: decimal
          type: string
        line_vat_amount_accounting_currency:
          description: |-
            EXT-FR-FE-182

            VAT amount of the invoice line in the accounting currency
          format: decimal
          type: string
        line_vat_currency:
          description: |-
            EXT-FR-FE-181-1

            Currency of the VAT Amount of the invoice line
          type: string
        line_with_vat_net_amount:
          description: |-
            EXT-FR-FE-184

            Total amount with VAT of the invoice line
          format: decimal
          type: string
        net_amount:
          description: >-
            BT-131


            Invoice line net amount

            The total amount of the Invoice line.

            The amount is “net” without VAT, i.e. inclusive of line level
            allowances and charges as well as other relevant taxes.
          format: decimal
          type: string
        notes:
          description: >-
            BT-127


            Invoice line note

            A textual note that gives unstructured information that is relevant
            to the Invoice line.
          items:
            $ref: "#/components/schemas/invoice_line_note"
          type: array
        object_identifier:
          description: >-
            BT-128


            Invoice line object identifier

            An identifier for an object on which the invoice line is based,
            given by the Seller.

            It may be a subscription number, telephone number, meter point etc.,
            as applicable.

            Scheme identifier

            The identification scheme identifier of the Invoice line object
            identifier.

            If it may be not clear for the receiver what scheme is used for the
            identifier, a conditional scheme identifier should be used that
            shall be chosen from the UNTDID 1153 code list [6] entries.
          items:
            $ref: "#/components/schemas/identifier"
          type: array
        parent_identifier:
          description: >-
            EXT-FR-FE-162


            Parent line identifier

            Identifier of the parent line to which this line is attached (in
            case of sub-line)
          type: string
