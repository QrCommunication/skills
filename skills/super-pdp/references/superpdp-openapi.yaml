      properties:
        amount:
          description: |-
            BT-92, BT-99, BT-136, BT-141

            Document level allowance/charge amount
            The amount of an allowance/charge, without VAT.
          format: decimal
          type: string
        base_amount:
          description: >-
            BT-93, BT-100, BT-137, BT-142


            Document level allowance/charge base amount

            The base amount that may be used, in conjunction with the document
            level allowance/charge percentage, to calculate the document level
            allowance/charge amount.
          format: decimal
          type: string
        percent:
          description: >-
            BT-94, BT-101, BT-138, BT-143


            Document level allowance/charge percentage

            The percentage that may be used, in conjunction with the document
            level allowance/charge base amount, to calculate the document level
            allowance/charge amount.
          format: decimal
          type: string
        reason:
          description: >-
            BT-97, BT-104, BT-139, BT-144


            Document level allowance/charge reason

            The reason for the document level allowance/charge, expressed as
            text.
          type: string
        reason_code:
          $ref: "#/components/schemas/reason_code"
      required:
        - amount
      type: object
    invoice_line_note:
      properties:
        note:
          description: BT-127
          type: string
        subject_code:
          $ref: "#/components/schemas/invoice_note_code"
      required:
        - subject_code
        - note
      type: object
    invoice_note:
      properties:
        note:
          description: >-
            BT-22


            Invoice note

            A textual note that gives unstructured information that is relevant
            to the Invoice as a whole.

            Such as the reason for any correction or assignment note in case the
            invoice has been factored
          type: string
        subject_code:
          $ref: "#/components/schemas/invoice_note_code"
      required:
        - note
      type: object
    invoice_note_code:
      description: |-
        BT-21

        Invoice note subject code
        The subject of the textual note in BT-22.
        To be chosen from the entries in UNTDID 4451 [6].

        EXT-FR-FE-183
      type: string
    invoice_overview:
      description: The invoice overview is the top level object of invoice. For more
        detail, check the invoice structure
      properties:
        company_id:
          type: integer
        created_at:
          format: date-time
          type: string
        en_invoice:
          $ref: "#/components/schemas/en_invoice_overview"
        events:
          items:
            $ref: "#/components/schemas/event"
          type: array
        id:
          description: the invoice id
          type: integer
      required:
        - id
        - company_id
        - created_at
      type: object
    invoice_type_code:
      description: >-
        BT-3


        Invoice type code

        A code specifying the functional type of the Invoice.

        Commercial invoices and credit notes are defined according the entries
        in UNTDID 1001 [6]. Other entries of UNTDID 1001 [6] with specific
        invoices or credit notes may be used if applicable.


        EXT-FR-FE-02


        Type de facture antérieure

        UNTDID 1001

        BR-FR-04

        Code spécifiant le type fonctionnel de la Facture antérieure


        EXT-FR-FE-137
      type: integer
    invoiced_object_identifier:
      type: object
    invoicing_period:
      description: >-
        BG-14


        A group of business terms providing information on the invoice period.

        Used to indicate when the period covered by the invoice starts and when
        it ends. Also called delivery period.


        BG-26


        A group of business terms providing information about the period
        relevant for the Invoice line.

        Is also called Invoice line delivery period.
      properties:
        end_date:
          description: |-
            BT-74, BT-135

            The date when the Invoice period ends.
            The date on which the delivery of goods or services was completed.
          format: date
          type: string
        start_date:
          description: |-
            BT-73, BT-134

            The date when the Invoice period starts.
            The initial date of delivery of goods or services.
          format: date
          type: string
      type: object
    item_attribute:
      properties:
        code:
          description: |-
            EXT-FR-FE-159

            Item attribute code
            Code to qualify the article attribute
            Example: BRL for a CO2 measurement
          type: string
        name:
          description: |-
            BT-160

            Item attribute name
            The name of the attribute or property of the item.
            Such as “Colour”.
          type: string
        quantity:
          description: |-
            EXT-FR-FE-160

            Value with measure unit
          format: decimal
          type: string
        quantity_unit:
          description: EXT-FR-FE-161
          type: string
        value:
          description: |-
            BT-161

            Item attribute value
            The value of the attribute or property of the item.
            Such as “Red”.
          type: string
      required:
        - value
      type: object
    item_information:
      description: >-
        BG-31


        A group of business terms providing information about the goods and
        services invoiced.
      properties:
        attributes:
          description: >-
            BG-32


            A group of business terms providing information about properties of
            the goods and services invoiced.
          items:
            $ref: "#/components/schemas/item_attribute"
          type: array
        buyer_identifier:
          description: |-
            BT-156

            Item Buyer's identifier
            An identifier, assigned by the Buyer, for the item.
          type: string
        classification_identifier:
          description: BT-158
          items:
            $ref: "#/components/schemas/classification_identifier"
          type: array
        country_of_origin:
          description: >-
            BT-159


            Item country of origin

            The code identifying the country from which the item originates.

            The lists of valid countries are registered with the EN ISO 3166-1
            Maintenance agency, “Codes for the representation of names of
            countries and their subdivisions”.
          type: string
        description:
          description: >-
            BT-154


            Item description

            A description for an item.

            The Item description allows for describing the item and its features
            in more detail than the Item name.
          type: string
        name:
          description: |-
            BT-153

            Item name
            A name for an item.
          type: string
        seller_identifier:
          description: |-
            BT-155

            Item Seller's identifier
            An identifier, assigned by the Seller, for the item.
          type: string
        standard_identifier_scheme:
          description: |-
            BT-157-1

            Scheme identifier
            The identification scheme identifier of the Item standard identifier
          type: string
        standard_identifier_value:
          description: |-
            BT-157

            Item standard identifier
            An item identifier based on a registered scheme.
          type: string
      required:
        - name
      type: object
    legal_registration_identifier:
      description: >-
        BT-30, EXT-FR-FE-167


        Seller legal registration identifier

        An identifier issued by an official registrar that identifies the Seller
        as a legal entity or person.

        If no identification scheme is specified, it should be known by Buyer
        and Seller.

        Scheme identifier

        The identification scheme identifier of the Seller legal registration
        identifier.

        If used, the identification scheme shall be chosen from the entries of
        the list published by the ISO/IEC 6523 maintenance agency.


        BT-47


        Buyer legal registration identifier

        An identifier issued by an official registrar that identifies the Buyer
        as a legal entity or person.

        If no identification scheme is specified, it should be known by Buyer
        and Seller, e.g. the identifier that is exclusively used in the
        applicable legal environment.

        Scheme identifier

        The identification scheme identifier of the Buyer legal registration
        identifier.

        If used, the identification scheme shall be chosen from the entries of
        the list published by the ISO/IEC 6523 maintenance agency.


        EXT-FR-FE-08, EXT-FR-FE-09, EXT-FR-FE-48, EXT-FR-FE-49, EXT-FR-FE-71,
        EXT-FR-FE-72, EXT-FR-FE-94, EXT-FR-FE-95, EXT-FR-FE-117, EXT-FR-FE-118


        BT-61


        Payee legal registration identifier

        An identifier issued by an official registrar that identifies the Payee
        as a legal entity or person.

        If no scheme is specified, it should be known by Buyer and Seller, e.g.
        the identifier that is exclusively used in the applicable legal
        environment.

        Scheme identifier

        The identification scheme identifier of the Payee legal registration
        identifier.

        If used, the identification scheme shall be chosen from the entries of
        the list published by the ISO/IEC 6523 maintenance agency.
      properties:
        scheme:
          type: string
        value:
          type: string
      required:
        - value
        - scheme
      type: object
    line_delivery_address:
      description: EXT-FR-FE-BG-10
      properties:
        delivery_place_identifier:
          description: EXT-FR-FE-146, EXT-FR-FE-148
          items:
            $ref: "#/components/schemas/identifier"
          type: array
        delivery_place_name:
          description: EXT-FR-FE-149
          type: string
        postal_address:
          $ref: "#/components/schemas/postal_address"
      required:
        - delivery_place_identifier
        - delivery_place_name
        - postal_address
      type: object
    line_identifier:
      description: |-
        EXT-FR-FE-BG-07

        EXT-FR-FE-BG-08

        EXT-FR-FE-BG-09
      properties:
        identifier:
          description: EXT-FR-FE-140, EXT-FR-FE-142, EXT-FR-FE-144
          type: string
        line_identifier:
          description: EXT-FR-141, EXT-FR-FE-143, EXT-FR-FE-145
          type: string
      required:
        - identifier
        - line_identifier
      type: object
    line_vat_information:
      description: >-
        BG-30


        A group of business terms providing information about the VAT applicable
        for the goods and services invoiced on the Invoice line.
      properties:
        due_date_code:
          description: |-
            EXT-FR-FE-180

            VAT due date code on line
          type: string
        exemption_reason:
          description: |-
            EXT-FR-FE-178

            VAT exemption reason
          type: string
        exemption_reason_code:
          description: |-
            EXT-FR-FE-179

            VAT exemption reason code
          type: string
        invoiced_item_vat_category_code:
          $ref: "#/components/schemas/vat_category_code"
        invoiced_item_vat_rate:
          description: >-
            BT-152


            Invoiced item VAT rate

            The VAT rate, represented as percentage that applies to the invoiced
            item.
          format: decimal
          type: string
      required:
        - invoiced_item_vat_category_code
      type: object
    list_directory_entries:
      description: list directory_entries
      properties:
        data:
          items:
            $ref: "#/components/schemas/directory_entry"
          type: array
      required:
        - data
      type: object
    list_events:
      description: list events
      properties:
        data:
          items:
            $ref: "#/components/schemas/event"
          type: array
        has_after:
          type: boolean
      required:
        - data
        - has_after
      type: object
    list_invoices:
      description: list invoices
      properties:
        count:
          example: 1
          type: integer
        data:
          items:
            $ref: "#/components/schemas/invoice_overview"
          type: array
        has_after:
          type: boolean
        has_before:
          type: boolean
      required:
        - data
        - count
        - has_after
        - has_before
      type: object
    message:
      properties:
        message:
          description: message of the report
          type: string
        raw:
          description: raw message of the report
          type: string
      required:
        - message
        - raw
      type: object
    payee:
      description: >-
        BG-10


        A group of business terms providing information about the Payee, i.e.
        the role that receives the payment.

        The role of Payee may be fulfilled by another party than the Seller,
        e.g. a factoring service.
      properties:
        contact:
          $ref: "#/components/schemas/contact"
        electronic_address:
          $ref: "#/components/schemas/electronic_address"
        identifiers:
          description: >-
            BT-60


            Payee identifier

            An identifier for the Payee.

            If no scheme is specified, it should be known by Buyer and Seller,
            e.g. a previously exchanged Buyer or Seller assigned identifier.

            Scheme identifier

            The identification scheme identifier of the Payee identifier.

            If used, the identification scheme shall be chosen from the entries
            of the list published by the ISO/IEC 6523 maintenance agency.
          items:
            $ref: "#/components/schemas/identifier"
          type: array
        legal_registration_identifier:
          $ref: "#/components/schemas/legal_registration_identifier"
        name:
          description: >-
            BT-59


            The name of the Payee.

            Shall be used when the Payee is different from the Seller. The Payee
            name may however be the same as the Seller name.
          type: string
        postal_address:
          $ref: "#/components/schemas/postal_address"
        role_code:
          description: |-
            EXT-FR-FE-26

            https://service.unece.org/trade/untdid/d99a/uncl/uncl3035.htm
          type: string
        vat_identifier:
          description: BT-31, BT-48, EXT-FR-FE-27, EXT-FR-FE-28, EXT-FR-FE-10,
            EXT-FR-FE-11, EXT-FR-FE-50, EXT-FR-FE-51, EXT-FR-FE-73,
            EXT-FR-FE-74, EXT-FR-FE-96, EXT-FR-FE-97, EXT-FR-FE-119,
            EXT-FR-FE-120
          type: string
      required:
        - name
      type: object
    payment_card_information:
      description: >-
        BG-18


        A group of business terms providing information about card used for
        payment contemporaneous with invoice issuance.

        Only used if the Buyer had opted to pay by using a payment card such as
        a credit or debit card.
      properties:
        account_number:
          description: >-
            BT-87


            Payment card primary account number

            The Primary Account Number (PAN) of the card used for payment.

            In accordance with card payments security standards an invoice
            should never include a full card primary account number. At the
            moment PCI Security Standards Council has defined that the first 6
            digits and last 4 digits are the maximum number of digits to be
            shown.
          type: string
        holder_name:
          description: |-
            BT-88

            Payment card holder name
            The name of the payment card holder.
          type: string
        network_id:
          description: BT-87-1 Only in UBL
          type: string
      required:
        - account_number
      type: object
    payment_instructions:
      description: |-
        BG-16

        A group of business terms providing information about the payment.
      properties:
        credit_transfers:
          description: |-
            BG-17

            A group of business terms to specify credit transfer payments.
          items:
            $ref: "#/components/schemas/credit_transfer"
          type: array
        direct_debit:
          $ref: "#/components/schemas/direct_debit"
        payment_card_information:
          $ref: "#/components/schemas/payment_card_information"
        payment_means_text:
          description: >-
            BT-82


            Payment means text

            The means, expressed as text, for how a payment is expected to be or
            has been settled.

            Such as cash, credit transfer, direct debit, credit card, etc.
          type: string
        payment_means_type_code:
          $ref: "#/components/schemas/payment_means_code"
        remittance_information:
          description: >-
            BT-83


            Remittance information

            A textual value used to establish a link between the payment and the
            Invoice, issued by the Seller.

            Used for creditor's critical reconciliation information. This
            information element helps the Seller to assign an incoming payment
            to the relevant payment process. When specifying the textual value,
            which is commonly the invoice number of the invoice being paid, but
            may be another seller reference, the buyer should indicate this
            reference in his payment order when executing the payment. In a
            payment transaction this reference is transferred back to the Seller
            as Remittance Information. In order to allow for automatic
            processing of cross-border SEPA payments, only Latin characters
            should be used in this field, with a maximum of 140 characters.
            Reference section 1.4 of the SEPA credit transfer and SEPA direct
            debit scheme implementation guides [13] and [14] for details of the
            allowed characters. Other rules may apply for SEPA payments within
            national borders. If remittance information is structured according
            to the ISO 11649:2009 standard [16] for Structured RF Creditor
            Reference, it shall be mapped to the Structured Remittance
            Information Creditor Reference field in SEPA payments messages. If
            remittance information is structured according to the EACT standard
            for automated reconciliation [17], it shall be mapped to the
            Unstructured Remittance Information field in SEPA payments
            messages.” If remittance information is to be mapped to the End To
            End Identification field or to the Structured Remittance Information
            Creditor Reference field in SEPA payments messages, then in addition
            to the Latin character set restriction, the content shall not start
            or end with a '/' and the content shall not contain '//'s. See
            reference [15].
          type: string
      required:
        - payment_means_type_code
      type: object
    payment_means_code:
      description: >-
        https://unece.org/fileadmin/DAM/trade/untdid/d16b/tred/tred4461.htm


        BT-81


        Payment means type code

        The means, expressed as code, for how a payment is expected to be or has
        been settled.

        Entries from the UNTDID 4461 code list [6] shall be used. Distinction
        should be made between SEPA and non-SEPA payments, and between credit
        payments, direct debits, card payments and other instruments.
      type: string
    postal_address:
      description: >-
        BG-5, EXT-FR-FE-BG-13


        A group of business terms providing information about the address of the
        Seller.

        Sufficient components of the address are to be filled to comply with
        legal requirements.


        BG-8


        A group of business terms providing information about the postal address
        for the Buyer.

        Sufficient components of the address are to be filled to comply with
        legal requirements.


        EXT-FR-FE-14, EXT-FR-FE-54, EXT-FR-FE-77, EXT-FR-FE-100, EXT-FR-FE-123


        BG-8, EXT-FR-FE-31


        BG-12


        The Seller tax representative name/postal address shall be provided in
        the invoice, if the Seller has a tax representative who is liable to pay
        the VAT due. Sufficient components of the address are to be filled to
        comply with legal requirements.


        BG-15


        A group of business terms providing information about the address to
        which goods and services invoiced were or are delivered.

        In the case of pick-up, the deliver to address is the pick-up address.
        Sufficient components of the address are to be filled to comply with
        legal requirements.


        EXT-FR-FE-150
      properties:
        address_line1:
          description: >-
            BT-35, BT-50, BT-64, BT-75, EXT-FR-FE-15, EXT-FR-FE-32,
            EXT-FR-FE-55, EXT-FR-FE-78, EXT-FR-FE-101, EXT-FR-FE-124,
            EXT-FR-FE-151, EXT-FR-FE-171


            The main address line in an address.

            Usually the street name and number or post office box.
          type: string
        address_line2:
          description: >-
            BT-36, BT-51, BT-65, BT-76, EXT-FR-FE-16, EXT-FR-FR-33,
            EXT-FR-FE-56, EXT-FR-FE-79, EXT-FR-FE-102, EXT-FR-FE-125,
            EXT-FR-FE-152, EXT-FR-FE-172


            An additional address line in an address that can be used to give
            further details supplementing the main line.
          type: string
        address_line3:
          description: >-
            BT-162, BT-163, BT-164, BT-165, EXT-FR-FE-17, EXT-FR-FE-34,
            EXT-FR-FE-57, EXT-FR-FE-80, EXT-FR-FE-103, EXT-FR-FE-126,
            EXT-FR-FE-153, EXT-FR-FE-173


            An additional address line in an address that can be used to give
            further details supplementing the main line.
          type: string
        city:
          description: >-
            BT-37, BT-52, BT-66, BT-77, EXT-FR-FE-19, EXT-FR-FE-35,
            EXT-FR-FE-58, EXT-FR-FE-82, EXT-FR-FE-104, EXT-FR-FE-127,
            EXT-FR-FE-154, EXT-FR-FE-174


            The common name of the city, town or village, where the Seller/Buyer
            address is located.
          type: string
        country_code:
          description: >-
            BT-40, BT-55, BT-69, BT-80, EXT-FR-FE-21, EXT-FR-FE-38,
            EXT-FR-FE-61, EXT-FR-FE-84, EXT-FR-FE-107, EXT-FR-FE-130,
            EXT-FR-FE-157, EXT-FR-FE-177


            A code that identifies the country.

            If no tax representative is specified, this is the country where VAT
            is liable. The lists of valid countries are registered with the EN
            ISO 3166-1 Maintenance agency, “Codes for the representation of
            names of countries and their subdivisions”.
          type: string
        country_subdivision:
          description: >-
            BT-39, BT-54, BT-68, BT-79, EXT-FR-FE-20, EXT-FR-FE-37,
            EXT-FR-FE-60, EXT-FR-FE-83, EXT-FR-FE-106, EXT-FR-FE-129,
            EXT-FR-FE-156, EXT-FR-FE-176


            The subdivision of a country.

            Such as a region, a county, a state, a province, etc.
          type: string
        post_code:
          description: >-
            BT-38, BT-53, BT-67, BT-78, EXT-FR-FE-18, EXT-FR-FE-36,
            EXT-FR-FE-59, EXT-FR-FE-81, EXT-FR-FE-105, EXT-FR-FE-128,
            EXT-FR-FE-155, EXT-FR-FE-175


            The identifier for an addressable group of properties according to
            the relevant postal service.

            Such as a ZIP code or a post code.
          type: string
      required:
        - country_code
      type: object
    preceding_invoice_reference:
      properties:
        issue_date:
          description: >-
            BT-26


            The date when the Preceding Invoice was issued.

            The Preceding Invoice issue date shall be provided in case the
            Preceding Invoice identifier is not unique.
          format: date
          type: string
        preceding_invoice_type_code:
          $ref: "#/components/schemas/invoice_type_code"
        reference:
          description: >-
            BT-25


            Preceding Invoice reference

            The identification of an Invoice that was previously sent by the
            Seller.
          type: string
      required:
        - reference
      type: object
    price_details:
      description: >-
        BG-29


        A group of business terms providing information about the price applied
        for the goods and services invoiced on the Invoice line.
      properties:
        item_gross_price:
          description: >-
            BT-148


            Item gross price

            The unit price, exclusive of VAT, before subtracting Item price
            discount.
          format: decimal
          type: string
        item_net_price:
          description: >-
            BT-146


            Item net price

            The price of an item, exclusive of VAT, after subtracting item price
            discount.

            The Item net price has to be equal with the Item gross price less
            the Item price discount.
          format: decimal
          type: string
        item_price_base_quantity:
          description: |-
            BT-149

            Item price base quantity
            The number of item units to which the price applies.
          format: decimal
          type: string
        item_price_discount:
          description: >-
            BT-147


            Item price discount

            The total discount subtracted from the Item gross price to calculate
            the Item net price.

            Only applies if the discount is provided per unit and if it is not
            included in the Item gross price.
          format: decimal
          type: string
        quantity_unit_code:
          $ref: "#/components/schemas/unit_code"
      required:
        - item_net_price
      type: object
    process_control:
      description: >-
        BG-2


        A group of business terms providing information on the business process
        and rules applicable to the Invoice document.
      properties:
        business_process_type:
          description: >-
            BT-23


            Business process type

            Identifies the business process context in which the transaction
            appears, to enable the Buyer to process the Invoice in an
            appropriate way.

            To be specified by the Buyer.
          type: string
        specification_identifier:
          description: >-
            BT-24


            Specification identifier

            An identification of the specification containing the total set of
            rules regarding semantic content, cardinalities and business rules
            to which the data contained in the instance document conforms.

            This identifies compliance or conformance to this document.
            Compliant invoices specify: urn:cen.eu:en16931:2017. Invoices,
            compliant to a user specification may identify that user
            specification here. No identification scheme is to be used.
          type: string
      required:
        - specification_identifier
      type: object
    reason_code:
      description: >-
        BT-98, BT-105, BT-140, BT-145


        Document level allowance/charge reason code

        The reason for the document level allowance/charge, expressed as a code.

        Use entries of the UNTDID 5189 code list [6]. The Document level
        allowance/charge reason code and the Document level allowance/charge
        reason shall indicate the same allowance/charge reason.
      type: string
    report:
      description: report of an invoice analyze
      properties:
        conformance_level:
          description: conformence level of invoice
          example: urn:oasis:names:specification:ubl:schema:xsd:Invoice-2
          type: string
        duration:
          description: time taken for processing invoice in milliseconds
          example: 101
          type: integer
        error:
          description: error
          type: string
        file_name:
          description: name of related uploaded file
          example: invoice.pdf
          type: string
        file_size:
          description: size of related uploaded file
          example: "1024"
          type: integer
        format:
          description: format of invoice
          example: urn:oasis:names:specification:ubl:schema:xsd:Invoice-2
          type: string
        is_valid:
          description: validity of uploaded file
          type: boolean
        subreports:
          items:
            $ref: "#/components/schemas/subreport"
          type: array
      required:
        - file_name
        - file_size
        - is_valid
        - duration
        - format
        - conformance_level
        - subreports
      type: object
    seller:
      description: >-
        BG-4


        A group of business terms providing information about the Seller.


        EXT-FR-FE-BG-12


        Seller

        Group of business terms providing information about the Seller on the
        line

        In the case of a Multi-Seller invoice, the Seller can be identified on
        the line
      properties:
        additional_legal_information:
          description: |-
            BT-33

            Seller additional legal information
            Additional legal information relevant for the Seller.
            Such as share capital.
          type: string
        contact:
          $ref: "#/components/schemas/contact"
        electronic_address:
          $ref: "#/components/schemas/electronic_address"
        identifiers:
          description: >-
            BT-29, EXT-FR-FE-166


            Seller identifier

            An identification of the Seller

            For many systems, the Seller identifier is a key piece of
            information. Multiple Seller identifiers may be assigned or
            specified. They may be differentiated by using various
            identification schemes. If no scheme is specified, it should be
            known by Buyer and Seller, e.g. a previously exchanged Buyer
            assigned identifier of the Seller.

            The identification scheme identifier of the Seller identifier.

            If used, the identification scheme identifier shall be chosen from
            the entries of the list published by the ISO/IEC 6523 maintenance
            agency.
          items:
            $ref: "#/components/schemas/identifier"
          type: array
        legal_registration_identifier:
          $ref: "#/components/schemas/legal_registration_identifier"
        name:
          description: >-
            BT-27, BT-44, BT-59, EXT-FR-FE-03, EXT-FR-FE-43, EXT-FR-FE-66,
            EXT-FR-FE-89, EXT-FR-FE-112, EXT-FR-FE-164


            The full formal name by which the Seller is registered in the
            national registry of legal entities or as a Taxable person or
            otherwise trades as a person or persons.
          type: string
        postal_address:
          $ref: "#/components/schemas/postal_address"
        tax_registration_identifier:
          description: >-
            BT-32, EXT-FR-FE-169


            Seller tax registration identifier

            The local identification (defined by the Seller’s address) of the
            Seller for tax purposes or a reference that enables the Seller to
            state his registered tax status.

            This information may affect how the Buyer settles the payment (such
            as for social security fees). E.g. in some countries, if the Seller
            is not registered as a tax paying entity then the Buyer is required
            to withhold the amount of the tax and pay it on behalf of the
            Seller.
          type: string
        trading_name:
          description: >-
            BT-28, EXT-FR-FE-165


            Seller trading name

            A name by which the Seller is known, other than Seller name (also
            known as Business name).

            This may be used if different from the Seller name.
          type: string
        vat_identifier:
          description: >-
            BT-31, EXT-FR-FE-168


            Seller VAT identifier

            The Seller's VAT identifier (also known as Seller VAT identification
            number).

            VAT number prefixed by a country code. A VAT registered Supplier
            shall include his VAT ID, except when he uses a tax representative.
          type: string
      required:
        - name
        - electronic_address
        - postal_address
      type: object
    seller_tax_representative_party:
      description: >-
        BG-11


        A group of business terms providing information about the Seller's tax
        representative.
      properties:
        name:
          description: |-
            BT-62

            Seller tax representative name
            The full name of the Seller's tax representative party.
          type: string
        postal_address:
          $ref: "#/components/schemas/postal_address"
        vat_identifier:
          description: >-
            BT-63


            Seller tax representative VAT identifier

            The VAT identifier of the Seller's tax representative party.

            VAT number prefixed by a country code based on EN ISO 3166-1 "Codes
            for the representation of names of countries and their
            subdivisions".
          type: string
      required:
        - name
        - vat_identifier
        - postal_address
      type: object
    status_code:
      description: >-
        A list of processing events associated with the invoice.


        ### Architecture Note: No State Machine

        This property is an **array of statuses**. There is **no formal state
        machine** governing the transitions. Statuses can be added at any time,
        and their presence indicates an event has occurred rather than a
        current, exclusive state.


        ### Status Categories

        * **`api:*`**: Internal statuses defined by **Super PDP** only (not
        official).

        * **`fr:*`**: Official French "Facturation Électronique" statuses.
        Detailed definitions can be found in [our
        documentation](https://www.superpdp.tech/documentation/6).


        ### Routing Logic

        * **French Invoices**: Typically receive `fr:*` statuses.

        * **Peppol Invoices**: Used when an invoice does not belong to the
        French framework; these utilize `api:*` statuses.

        * **Exception**: `api:uploaded` is universal and used for both French
        and Peppol workflows as the initial entry point.


        ### Meaning of api:* Statuses

        * `api:uploaded`: Synchronously created upon posting. Passed syntactic
        checks (valid JSON/XML shape).

        * `api:invalid`: Error occurred before the invoice was sent to the
        external access point.

        * `api:validated`: Invoice passed semantic checks (Schematron).

        * `api:sent`: Invoice has been transmitted to the other access point.

        * `api:rejected`: Invoice was asynchronously rejected by the other
        access point.

        * `api:received`: Invoice received by another access point (reception
        mode).

        * `api:acknowledged`: The other access point returned an optional
        acknowledgment (received, but may have errors).

        * `api:accepted`: The other access point returned an optional acceptance
        (no errors).
      enum:
        - api:uploaded
        - api:invalid
        - api:validated
        - api:sent
        - api:rejected
        - api:received
        - api:acknowledged
        - api:accepted
        - fr:200
        - fr:201
        - fr:202
        - fr:203
        - fr:204
        - fr:205
        - fr:206
        - fr:207
        - fr:208
        - fr:209
        - fr:210
        - fr:211
        - fr:212
        - fr:213
      summary: Event-based log of internal (api:*) and official French (fr:*) invoice
        statuses.
      type: string
    status_code_create:
      description: check documentation of `status_code` for more information
      enum:
        - fr:204
        - fr:205
        - fr:206
        - fr:207
        - fr:208
        - fr:209
        - fr:210
        - fr:211
        - fr:212
      type: string
    subreport:
      properties:
        checks_count:
          description: number of checks beeing done by the validator
          example: 39
          type: integer
        failures:
          items:
            $ref: "#/components/schemas/message"
          type: array
        messages:
          items:
            $ref: "#/components/schemas/message"
          type: array
        validator:
          description: name of used validator
          example: PEPPOL-EN16931-UBL.xsl
          type: string
      required:
        - validator
        - checks_count
        - messages
        - failures
      type: object
    totals:
      description: |-
        BG-22

        A group of business terms providing the monetary totals for the Invoice.
      properties:
        amount_due_for_payment:
          description: >-
            BT-115


            Amount due for payment

            The outstanding amount that is requested to be paid.

            This amount is the Invoice total amount with VAT minus the paid
            amount that has been paid in advance. The amount is zero in case of
            a fully paid Invoice. The amount may be negative; in that case the
            Seller owes the amount to the Buyer.
          format: decimal
          type: string
        paid_amount:
          description: >-
            BT-113


            Paid amount

            The sum of amounts which have been paid in advance.

            This amount is subtracted from the invoice total amount with VAT to
            calculate the amount due for payment.
          format: decimal
          type: string
        rounding_amount:
          description: >-
            BT-114


            Rounding amount

            The amount to be added to the invoice total to round the amount to
            be paid.
          format: decimal
          type: string
        sum_allowances_amount:
          description: >-
            BT-107


            Sum of allowances on document level

            Sum of all allowances on document level in the Invoice.

            Allowances on line level are included in the Invoice line net amount
            which is summed up into the Sum of Invoice line net amount.
          format: decimal
          type: string
        sum_charges_amount:
          description: >-
            BT-108


            Sum of charges on document level

            Sum of all charges on document level in the Invoice.

            Charges on line level are included in the Invoice line net amount
            which is summed up into the Sum of Invoice line net amount.
          format: decimal
          type: string
        sum_invoice_lines_amount:
          description: |-
            BT-106

            Sum of Invoice line net amount
            Sum of all Invoice line net amounts in the Invoice.
          format: decimal
          type: string
        total_vat_amount:
          $ref: "#/components/schemas/amount"
        total_vat_amount_accounting_currency:
          $ref: "#/components/schemas/amount"
        total_with_vat:
          description: >-
            BT-112


            Invoice total amount with VAT

            The total amount of the Invoice with VAT.

            The Invoice total amount with VAT is the Invoice total amount
            without VAT plus the Invoice total VAT amount.
          format: decimal
          type: string
        total_without_vat:
          description: >-
            BT-109


            Invoice total amount without VAT

            The total amount of the Invoice without VAT.

            The Invoice total amount without VAT is the Sum of Invoice line net
            amount minus Sum of allowances on document level plus Sum of charges
            on document level.
          format: decimal
          type: string
      required:
        - sum_invoice_lines_amount
        - total_without_vat
        - total_with_vat
        - amount_due_for_payment
      type: object
    unit_code:
      description: >-
        BT-130


        Invoiced quantity unit of measure code

        The unit of measure that applies to the invoiced quantity.

        The unit of measure shall be chosen from the lists in UN/ECE
        Recommendation N°. 20 “Codes for Units of Measure Used in International
        Trade” [7] and UN/ECE Recommendation N° 21 “Codes for Passengers, Types
        of Cargo, Packages and Packaging Materials (with Complementary Codes for
        Package Names)” [19] applying the method described in UN/ECE Rec N° 20
        Intro 2.a). Note that in most cases it is not needed for Buyers and
        Sellers to implement these lists fully in their software. Sellers need
        only to support the units needed for their goods and services; Buyers
        only need to verify that the units used in the Invoice are equal to the
        units used in other documents (such as Contract, Catalogue, Order and
        Despatch advice).


        BT-150


        Item price base quantity unit of measure code

        The unit of measure that applies to the Item price base quantity.

        The Item price base quantity unit of measure shall be the same as the
        Invoiced quantity unit of measure (BT-130).
      type: string
    validation_report:
      properties:
        data:
          items:
            $ref: "#/components/schemas/report"
          type: array
      required:
        - data
      type: object
    vat_break_down:
      properties:
        vat_category_code:
          $ref: "#/components/schemas/vat_category_code"
        vat_category_rate:
          description: >-
            BT-119


            VAT category rate

            The VAT rate, represented as percentage that applies for the
            relevant VAT category.

            The VAT category code and the VAT category rate shall be consistent.
          format: decimal
          type: string
        vat_category_tax_amount:
          description: >-
            BT-117


            VAT category tax amount

            The total VAT amount for a given VAT category.

            Calculated by multiplying the VAT category taxable amount with the
            VAT category rate for the relevant VAT category.
          format: decimal
          type: string
        vat_category_taxable_amount:
          description: >-
            BT-116


            VAT category taxable amount

            Sum of all taxable amounts subject to a specific VAT category code
            and VAT category rate (if the VAT category rate is applicable).

            The sum of Invoice line net amount minus allowances plus charges on
            document level which are subject to a specific VAT category code and
            VAT category rate (if the VAT category rate is applicable).
          format: decimal
          type: string
        vat_exemption_reason:
          description: >-
            BT-120


            VAT exemption reason text

            A textual statement of the reason why the amount is exempted from
            VAT or why no VAT is being charged

            Articles 226 items 11 to 15 Directive 2006/112/EC [2].
          type: string
        vat_exemption_reason_code:
          $ref: "#/components/schemas/vat_exemption_reason_code"
        vat_identifier:
          description: |-
            BT-118-0

            VAT type code identifier qualifier
          type: string
      required:
        - vat_category_taxable_amount
        - vat_category_tax_amount
        - vat_category_code
      type: object
    vat_category_code:
      description: >-
        AE: VAT Reverse charge

        E: Exempt from tax

        G: Free export item, tax not charge

        K: VAT exempt for EEA intra-community supply of goods and services

        L: Canary Islands General Indirect Tax

        M: Tax for production, services and importation in Ceuta and Melilla

        O: Service outside scope of tax

        S: Standard rate

        Z: Zero rated goods


        BT-95, BT-102


        Document level allowance/charge VAT category code

        A coded identification of what VAT category applies to the document
        level allowance/charge.

        The following entries of UNTDID 5305 [6] are used (further clarification
        between brackets):

        - Standard rate (Liable for VAT in a standard way)

        - Zero rated goods (Liable for VAT with a percentage rate of zero)

        - Exempt from tax (VAT/IGIC/IPSI)

        - VAT Reverse Charge (Reverse charge VAT/IGIC/IPSI rules apply)

        - VAT exempt for intra community supply of goods (VAT/IGIC/IPSI not
        levied due to Intra-community supply rules)

        - Free export item, tax not charged (VAT/IGIC/IPSI not levied due to
        export outside of the EU)

        - Services outside scope of tax (Sale is not subject to VAT/IGIC/IPSI)

        - Canary Islands General Indirect Tax (Liable for IGIC tax)

        - Liable for IPSI (Ceuta/Melilla tax)


        BT-118


        VAT category code

        Coded identification of a VAT category.

        The following entries of UNTDID 5305 [6] are used (further clarification
        between brackets):

        - Standard rate (Liable for VAT in a standard way)

        - Zero rated goods (Liable for VAT with a percentage rate of zero)

        - Exempt from tax (VAT/IGIC/IPSI)

        - VAT Reverse Charge (Reverse charge VAT/IGIC/IPSI rules apply)

        - VAT exempt for intra community supply of goods (VAT/IGIC/IPSI not
        levied due to Intra-community supply rules)

        - Free export item, tax not charged (VAT/IGIC/IPSI not levied due to
        export outside of the EU)

        - Services outside scope of tax (Sale is not subject to VAT/IGIC/IPSI)

        - Canary Islands General Indirect Tax (Liable for IGIC tax)

        - Liable for IPSI (Ceuta/Melilla tax)


        BT-151


        Invoiced item VAT category code

        The VAT category code for the invoiced item.

        The following entries of UNTDID 5305 [6] are used (further clarification
        between brackets):

        - Standard rate (Liable for VAT in a standard way)

        - Zero rated goods (Liable for VAT with a percentage rate of zero)

        - Exempt from tax (VAT/IGIC/IPSI)

        - VAT Reverse Charge (Reverse charge VAT/IGIC/IPSI rules apply)

        - VAT exempt for intra community supply of goods (VAT/IGIC/IPSI not
        levied due to Intra-community supply rules)

        - Free export item, tax not charged (VAT/IGIC/IPSI not levied due to
        export outside of the EU)

        - Services outside scope of tax (Sale is not subject to VAT/IGIC/IPSI)

        - Canary Islands General Indirect Tax (Liable for IGIC tax)

        - Liable for IPSI (Ceuta/Melilla tax)
      enum:
        - AE
        - E
        - G
        - K
        - L
        - M
        - O
        - S
        - Z
      type: string
    vat_exemption_reason_code:
      description: |-
        BT-121

        VAT exemption reason code
        A coded statement of the reason for why the amount is exempted from VAT.
        Code list issued and maintained by the Connecting Europe Facility.
      type: string
  securitySchemes:
    oauth2:
      description: >
        Use authorization code to access data of another user after he gives his
        consent.

        Use client credentials to access your own data (similar to api key)
      flows:
        authorizationCode:
          authorizationUrl: https://api.superpdp.tech/oauth2/authorize
          scopes: {}
          tokenUrl: https://api.superpdp.tech/oauth2/token
        clientCredentials:
          scopes: {}
          tokenUrl: https://api.superpdp.tech/oauth2/token
      type: oauth2
info:
  description: >-
    The SUPER PDP API allows developers to programatically send and receive
    invoices in compliance with France’s electronic invoicing reform, and more
    generally within the Peppol network.


    Object ids are stored internally in our PostgreSQL database as positive
    bigints, which means that their values is in the range [1,
    9223372036854775807]


    Release Notes


    - 1.9.4 (2026-02-27): add parameter to en_invoice to support last version
      - Deprecate invoiced_object_identifier_scheme and invoiced_object_identifier_value fields. Use invoiced_object_identifiers array instead 

    - 1.9.3 (2026-02-23): add documentation on multipart request to convert to
    Factur-X


    - 1.9.2 (2026-02-09): add details and attachments to invoice_events
    responses


    - 1.9.1 (2026-01-28): document values of invoice statuses


    - 1.9.0 (2026-01-26):
      - add creation of invoice events with status: 'fr:204', 'fr:205', 'fr:206', 'fr:207', 'fr:208', 'fr:209', 'fr:210', 'fr:211'
      - add parameters to the invoice event 'fr:212' to specify the amount received

    - 1.8.0.beta (2026-01-20):
      - list invoice_events pagination to allow synchronization
      - list and get invoices expand invoice_events for convenient listing of events

    - 1.7.1.beta (2026-01-09): document all missing status code


    - 1.7.0.beta (2026-01-07): add endpoint to create and delete directory
    entries


    - 1.6.0.beta (2026-01-02): add endpoint to list directory entries


    - 1.5.0.beta (2025-12-31): describe post invoice_events with valid statuses


    - 1.4.0.beta (2025-12-10):

      - download Peppol BIS test invoice if test companies have non-french addresses

      - convert invoices now accepts factur-x as input

    - 1.3.0.beta (2025-12-03):
      - generate test invoice as json
      - new route to convert between json, cii and ubl

    - 1.2.0.beta (2025-12-01): define en_invoice structure in GET and LIST
    endpoints


    - 1.1.0.beta (2025-11-20): add endpoint to list invoice events
  title: SUPER PDP API
  version: 1.10.0.beta
paths:
  /v1.beta/companies/me:
    get:
      description: Show the company associated with the current access token.
      operationId: CompaniesMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/company"
          description: Success
      summary: Show the current company
      tags:
        - companies
  /v1.beta/directory_entries:
    get:
      description: >+
        List the directory entries of the company.


        The response contains addresses that can be used to send an invoice to
        the company.

      operationId: DirectoryEntriesList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list_directory_entries"
          description: Event created
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: List directory entries
      tags:
        - directory_entries
    post:
      description: Create a directory entry
      operationId: DirectoryEntryCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_directory_entry"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/directory_entry"
          description: Event created
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: Create a new directory entry
      tags:
        - directory_entries
  /v1.beta/directory_entries/{id}:
    delete:
      description: Delete a directory entry. "Reply-to" addresses are technical
        addresses and cannot be deleted
      operationId: DirectoryEntryDelete
      parameters:
        - description: The id of the directory entry
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204": {}
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: Delete directory entry
      tags:
        - directory_entries
    get:
      description: Get directory entry
      operationId: DirectoryEntryGet
      parameters:
        - description: The id of the directory entry
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/directory_entry"
          description: Event created
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: Get a directory entry
      tags:
        - directory_entries
  /v1.beta/invoice_events:
    get:
      description: >-
        List invoices events.

         By default, events for all invoices are listed. Use `invoice_id` parameter to select only events related to one invoice.

        Invoice events are sorted by id in ascending order.


        Pagination is controlled with 2 parameters: `limit` and
        `starting_after_id`. These parameters allows to return invoice events
        with ids stricly greater than the provided id.


        At most, `limit` invoices are returned per page with a default of 100
        and a maximum of 1000.


        Along with the data, `has_after` is returned. `has_after` is true if one
        or more invoice events, that is not on the current page, exist with a
        greater id.
      operationId: InvoiceEventsList
      parameters:
        - in: query
          name: invoice_id
          schema:
            type: integer
        - in: query
          name: starting_after_id
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            default: 100
            maximum: 1000
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list_events"
          description: Event created
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: List invoices events
      tags:
        - invoice_events
    post:
      description: Create an invoice event message and place it in a queue to be sent
        asynchronously. If the status_code is 'fr:212' without details, the
        amount will be the invoice total.
      operationId: InvoiceEventsCreate
      requestBody:
        content:
          application/json:
            schema:
              properties:
                attachments:
                  items:
                    $ref: "#/components/schemas/invoice_event_attachment"
                  type: array
                details:
                  items:
                    $ref: "#/components/schemas/invoice_event_detail"
                  type: array
                invoice_id:
                  type: integer
                status_code:
                  $ref: "#/components/schemas/status_code_create"
              required:
                - invoice_id
                - status_code
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/event"
          description: Event created
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: Create an invoice event
      tags:
        - invoice_events
  /v1.beta/invoices:
    get:
      description: >-
        List invoices.


        By default, both incoming and outgoing invoices are listed. Use the
        `direction` parameter to select only incoming or outgoing invoices.


        The list of invoices can be narrowed down to a period with the `date`
        parameter. Accepted format are `YYYY`, `YYYY-MM`, `YYYY-MM-DD`.


        By default, the invoices are sorted by id in ascending order. The
        `order` parameter can be used to change the order direction.


        Pagination is controlled with 2 parameters: `limit` and one of
        `starting_after_id` or `ending_before_id`. These parameters allows to
        return invoices with ids stricly greater, or stictly less, than the
        provided id.


        At most, `limit` invoices are returned per page with a default of 100
        and a maximum of 1000.


        Along with the data, 3 values are returned: `count`, `has_before` and
        `has_after`. `count` is equal to the total number of invoices of all the
        pages. `has_before` is true if one or more invoices, that are not in the
        current page, exist with a smaller id. `has_after` is true if one or
        more invoices, that are not on the current page, exist with a greater
        id.


        By default, the `en_invoice` property is not returned, for performance
        reasons. Use the expand parameter to control the amount of expanded data
        in the response. The basic usage is `expand[]=en_invoice` to return
        expanded data for the en_invoice propery. A more advanced usage to
        return nested expanded data is, for example,
        `expand[]=en_invoice&expand[]=en_invoice.lines`.
      operationId: InvoicesList
      parameters:
        - in: query
          name: direction
          schema:
            enum:
              - in
              - out
            type: string
        - in: query
          name: date
          schema:
            example: 2025-11
            type: string
        - in: query
          name: order
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
        - in: query
          name: starting_after_id
          schema:
            type: integer
        - in: query
          name: ending_before_id
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            default: 100
            maximum: 1000
            type: integer
        - in: query
          name: expand[]
          schema:
            items:
              enum:
                - en_invoice
                - en_invoice.invoice
                - en_invoice.seller
                - en_invoice.buyer
                - en_invoice.notes
                - en_invoice.preceding_invoice_references
                - en_invoice.buyer_agent
                - en_invoice.payee
                - en_invoice.payer
                - en_invoice.seller_agent
                - en_invoice.addressed_to
                - en_invoice.third_party_biller
                - en_invoice.delivery_information
                - en_invoice.deliver_to_address
                - en_invoice.payment_instructions
                - en_invoice.document_level_allowances
                - en_invoice.document_level_charges
                - en_invoice.vat_break_down
                - en_invoice.additional_supporting_documents
                - en_invoice.lines
                - events
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list_invoices"
          description: Success
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: List invoices
      tags:
        - invoices
    post:
      description: Create an invoice and place it in a queue to be sent
        asynchronously. Succeeds if the XML structure of the payload is valid,
        but this does not mean that the invoice will pass the additionnal
        validation steps, or that the transmission will succeed. The `id`
        attribute in the responds allows to fetch the invoice events later.
      operationId: InvoicesCreate
      requestBody:
        content:
          application/xml: {}
          multipart/form-data:
            schema:
              properties:
                file_name:
                  example: invoice.pdf
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/invoice"
          description: Success
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: Create (send) an invoice
      tags:
        - invoices
  /v1.beta/invoices/convert:
    post:
      description: Convert an invoice to another format. It is possible to use a
        multipart request to combine a PDF and a invoice to get a Factur-X in
        ouput
      operationId: ConvertInvoice
      parameters:
        - description: Format of uploaded invoice.
          in: query
          name: from
          required: true
          schema:
            $ref: "#/components/schemas/convert_invoice_format"
        - description: Format of returned invoice.
          in: query
          name: to
          required: true
          schema:
            $ref: "#/components/schemas/convert_invoice_format"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/en_invoice"
          application/xml: {}
          multipart/form-data:
            encoding:
              invoice:
                contentType: application/json, application/xml
              pdf:
                contentType: application/pdf
            schema:
              properties:
                invoice:
                  description: The invoice to include in the PDF in JSON or CII format
                  oneOf:
                    - $ref: "#/components/schemas/en_invoice"
                    - description: The invoice in XML to include in the PDF
                      format: binary
                      type: string
                pdf:
                  description: The PDF file used to render the Factur-X
                  format: binary
                  type: string
              required:
                - pdf
                - invoice
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/en_invoice"
            application/xml: {}
          description: Success
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      security: []
      summary: Convert invoice
      tags:
        - invoices
  /v1.beta/invoices/generate_test_invoice:
    get:
      description: This is a convenience method for companies in sandbox mode, because
        generating a valid invoice can be troublesome. Nothing is saved in our
        database, the returned invoice is ready to be sent with the API. By
        default, the seller of the invoice will be the company associated with
        the access token. The buyer will be randomly picked among the other
        sandbox companies.
      operationId: GenerateTestInvoice
      parameters:
        - description: Format of returned invoice.
          in: query
          name: format
          required: true
          schema:
            $ref: "#/components/schemas/generate_test_invoice_format"
      responses:
        "200":
          content:
            application/xml: {}
          description: Invoice generated with the format passed in parameters
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: Download a test invoice
      tags:
        - invoices
  /v1.beta/invoices/{id}:
    get:
      description: Get an invoice with a specific id.
      operationId: InvoicesGet
      parameters:
        - description: The id of the invoice
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/invoice"
          description: Success
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: Get invoice
      tags:
        - invoices
  /v1.beta/invoices/{id}/download:
    get:
      description: Download the raw invoice file referenced by the id. The data can be
        either XML or PDF.
      operationId: InvoicesDownload
      parameters:
        - description: The id of the invoice to download
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            application/xml:
              schema:
                format: binary
                type: string
          description: The invoice file
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      summary: Download raw invoice file
      tags:
        - invoices
  /v1.beta/validation_reports:
    post:
      description: Send one or more invoices as multipart and get a validation report
        for each invoice. The invoice format will be automatically detected and
        the appropriate validation rules will be used.
      operationId: ValidationReports
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file_name:
                  example: invoice.pdf
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validation_report"
          description: Success
        "400":
          $ref: "#/components/responses/bad_request"
        "500":
          $ref: "#/components/responses/internal_server_error"
      security: []
      summary: Validate invoices
      tags:
        - invoices
security:
  - oauth2: []
