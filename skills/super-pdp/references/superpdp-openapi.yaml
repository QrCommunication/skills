          $ref: "#/components/schemas/invoicing_period"
        price_details:
          $ref: "#/components/schemas/price_details"
        purchase_order_reference_from_buyer:
          description: EXT-FR-FE-135
          type: string
        real_delivery_date:
          description: EXT-FR-FE-158, EXT-FR-FE-BG-11
          format: date
          type: string
        receipt_voucher:
          $ref: "#/components/schemas/line_identifier"
        referenced_purchase_order_line_reference:
          description: >-
            BT-132


            Referenced purchase order line reference

            An identifier for a referenced line within a purchase order, issued
            by the Buyer.

            The purchase order identifier is referenced on document level.
          type: string
        sales_order:
          $ref: "#/components/schemas/line_identifier"
        seller:
          $ref: "#/components/schemas/seller"
        shipping_notice:
          $ref: "#/components/schemas/line_identifier"
        subtype:
          description: >-
            EXT-FR-FE-163


            Line type which allows you to determine if the line data is to be
            used for calculating the invoice

            Value to choose between the following values:

            - DETAIL: standard line or sub-line, taken into account in the
            calculations of totals and VAT detail

            - GROUP: grouping line, to which child lines refer. Certain
            mandatory one-line references are no longer mandatory. If the line
            total excluding tax (BT-131) is entered, it must be equal to the sum
            of the line totals excluding tax of the sub-lines.

            - INFORMATION: line with data for information, not taken into
            account in the calculations
          type: string
        vat_information:
          $ref: "#/components/schemas/line_vat_information"
      required:
        - identifier
        - invoiced_quantity
        - invoiced_quantity_code
        - net_amount
        - price_details
        - vat_information
        - item_information
      type: object
