          description: |-
            BT-92, BT-99, BT-136, BT-141

            Document level allowance/charge amount
            The amount of an allowance/charge, without VAT.
          format: decimal
          type: string
        base_amount:
          description: >-
            BT-93, BT-100, BT-137, BT-142


            Document level allowance/charge base amount

            The base amount that may be used, in conjunction with the document
            level allowance/charge percentage, to calculate the document level
            allowance/charge amount.
          format: decimal
          type: string
        percent:
          description: >-
            BT-94, BT-101, BT-138, BT-143


            Document level allowance/charge percentage

            The percentage that may be used, in conjunction with the document
            level allowance/charge base amount, to calculate the document level
            allowance/charge amount.
          format: decimal
          type: string
        reason:
          description: >-
            BT-97, BT-104, BT-139, BT-144


            Document level allowance/charge reason

            The reason for the document level allowance/charge, expressed as
            text.
          type: string
        reason_code:
          $ref: "#/components/schemas/reason_code"
        vat_category_code:
          $ref: "#/components/schemas/vat_category_code"
        vat_identifier:
          description: |-
            BT-95-0, BT-102-0

            VAT identifier qualifier for the discount at document level
          type: string
        vat_rate:
          description: >-
            BT-96, BT-103


            Document level allowance/charge VAT rate

            The VAT rate, represented as percentage that applies to the document
            level allowance/charge.
          format: decimal
          type: string
      required:
        - vat_category_code
        - amount
      type: object
