openapi: 3.0.4
components:
  responses:
    bad_request:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/http_ko"
      description: Bad request
    internal_server_error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/http_ko"
      description: Unexpected error happened
  schemas:
    additional_reference_previous_invoice_line:
      description: EXT-FR-FE-BG-06
      properties:
        previous_invoice_id:
          description: EXT-FR-FE-136
          type: string
        previous_invoice_issue_date:
          description: EXT-FR-FE-138
          format: date
          type: string
        previous_invoice_line_number:
          description: EXT-FR-FE-139
          type: string
        previous_invoice_type_code:
          $ref: "#/components/schemas/invoice_type_code"
      required:
        - previous_invoice_id
        - previous_invoice_type_code
        - previous_invoice_issue_date
        - previous_invoice_line_number
      type: object
    additional_supporting_document:
      properties:
        attached_document:
          $ref: "#/components/schemas/binary_object"
        document_description:
          description: |-
            BT-123

            Supporting document description
            A description of the supporting document.
            Such as: timesheet, usage report etc.
          type: string
        document_reference:
          description: |-
            BT-122

            Supporting document reference
            An identifier of the supporting document.
          type: string
        external_document_location:
          description: >-
            BT-124


            External document location

            The URL (Uniform Resource Locator) that identifies where the
            external document is located.

            A means of locating the resource including its primary access
            mechanism, e.g. http:// or ftp://. External document location shall
            be used if the Buyer requires additional information to support the
            Invoice. External documents do not form part of the invoice. Risks
            can be involved when accessing external documents.
          type: string
        key:
          type: string
      required:
        - document_reference
        - key
      type: object
    allowance_or_charge:
      properties:
        amount:
          description: |-
            BT-92, BT-99, BT-136, BT-141

            Document level allowance/charge amount
            The amount of an allowance/charge, without VAT.
          format: decimal
          type: string
        base_amount:
          description: >-
            BT-93, BT-100, BT-137, BT-142


            Document level allowance/charge base amount

            The base amount that may be used, in conjunction with the document
            level allowance/charge percentage, to calculate the document level
            allowance/charge amount.
          format: decimal
          type: string
        percent:
          description: >-
            BT-94, BT-101, BT-138, BT-143


            Document level allowance/charge percentage

            The percentage that may be used, in conjunction with the document
            level allowance/charge base amount, to calculate the document level
            allowance/charge amount.
          format: decimal
          type: string
        reason:
          description: >-
            BT-97, BT-104, BT-139, BT-144


            Document level allowance/charge reason

            The reason for the document level allowance/charge, expressed as
            text.
          type: string
        reason_code:
          $ref: "#/components/schemas/reason_code"
      required:
        - amount
      type: object
    allowance_or_charge_kind:
      description: |-
        allowance
        charge
      enum:
        - allowance
        - charge
      type: string
    amount:
      description: >-
        BT-110


        Invoice total VAT amount

        The total VAT amount for the Invoice.

        The Invoice total VAT amount is the sum of all VAT category tax amounts.


        BT-111


        Invoice total VAT amount in accounting currency

        The VAT total amount expressed in the accounting currency accepted or
        required in the country of the Seller.

        To be used when the VAT accounting currency (BT-6) differs from the
        Invoice currency code (BT-5) in accordance with article 230 of Directive
        2006/112 / EC on VAT. The VAT amount in accounting currency is not used
        in the calculation of the Invoice totals.
      properties:
        currency_code:
          $ref: "#/components/schemas/currency_code"
        value:
          format: decimal
          type: string
      required:
        - value
      type: object
    binary_object:
      description: BT-125
      properties:
        document:
          description: >-
            BT-125-1


            Attached document

            An attached document embedded as binary object or sent together with
            the invoice.

            Attached document is used when documentation shall be stored with
            the Invoice for future reference or audit purposes.
          format: byte
          type: string
        filename:
          description: |-
            BT-125-1

            Attached document Filename
            The file name of the attached document
          type: string
        mime_code:
          description: |-
            BT-125-2

            Attached document Mime code
            The mime code of the attached document.
            Allowed mime codes:
            - application/pdf
            - image/png
            - image/jpeg
            - text/csv
            - application/vnd.openxmlformats- officedocument.spreadsheetml.sheet
            - application/vnd.oasis.opendocument. spreadsheet
          type: string
      required:
        - mime_code
        - filename
      type: object
    buyer:
      description: |-
        BG-7

        A group of business terms providing information about the Buyer.
      properties:
        contact:
          $ref: "#/components/schemas/contact"
        electronic_address:
          $ref: "#/components/schemas/electronic_address"
        identifiers:
          description: >-
            BT-46


            Buyer identifier

            An identifier of the Buyer.

            If no scheme is specified, it should be known by Buyer and Seller,
            e.g. a previously exchanged Seller assigned identifier of the Buyer.

            Scheme identifier

            The identification scheme identifier of the Buyer identifier.

            If used, the identification scheme shall be chosen from the entries
            of the list published by the ISO/IEC 6523 maintenance agency.
          items:
            $ref: "#/components/schemas/identifier"
          type: array
        legal_registration_identifier:
          $ref: "#/components/schemas/legal_registration_identifier"
        name:
          description: |-
            BT-44

            Buyer name
            The full name of the Buyer.
          type: string
        postal_address:
          $ref: "#/components/schemas/postal_address"
        trading_name:
          description: >-
            BT-45


            Buyer trading name

            A name by which the Buyer is known, other than Buyer name (also
            known as Business name).

            This may be used if different from the Buyer name.
          type: string
        vat_identifier:
          description: >-
            BT-48


            Buyer VAT identifier

            The Buyer's VAT identifier (also known as Buyer VAT identification
            number).

            VAT number prefixed by a country code based on EN ISO 3166-1 "Codes
            for the representation of names of countries and their subdivisions"
          type: string
      required:
        - name
        - postal_address
      type: object
    classification_identifier:
      properties:
        scheme:
          description: >-
            Scheme identifier

            The identification scheme identifier of the Item classification
            identifier

            The identification scheme shall be chosen from the entries in UNTDID
            7143 [6].
          type: string
        value:
          description: >-
            Item classification identifier

            A code for classifying the item by its type or nature.

            Classification codes are used to allow grouping of similar items for
            a various purposes e.g. public procurement (CPV), e- Commerce
            (UNSPSC) etc.
          type: string
        version_scheme:
          description: |-
            Scheme version identifier
            The version of the identification scheme.
          type: string
      required:
        - value
        - scheme
        - version_scheme
      type: object
    company:
      description: Company represent one legal structure with a unique SIREN code that
        can be using sandbox or production environment
      properties:
        address:
          description: Address of the company
          type: string
        city:
          description: City of the company
          type: string
        country:
          description: Country of the company
          type: string
        created_at:
          format: date-time
          type: string
        env:
          enum:
            - sandbox
            - production
          type: string
        formal_name:
          description: Formal name of the company
          type: string
        id:
          type: integer
        number:
          description: Identifier of the company
          type: string
        number_scheme:
          description: Source from company identifier
          enum:
            - sandbox
            - fr_siren
            - be_numero_entreprise
          type: string
        postcode:
          description: Postcode of the company
          type: string
        trade_name:
          description: Trade name of the company
          type: string
      required:
        - id
        - created_at
        - env
        - number_scheme
        - number
        - formal_name
        - trade_name
        - address
        - postcode
        - city
        - country
      type: object
    contact:
      description: >-
        BG-6


        A group of business terms providing contact information about the
        Seller.


        BG-9


        Contact details can be given by the Buyer at the time of the ordering or
        as master data exchanged prior to ordering. Contact details should not
        be used for the purpose of routing the received Invoice internally by
        the recipient; the Buyer reference identifier should be used for this
        purpose.


        EXT-FR-FE-39, EXT-FR-FE-22, EXT-FR-FE-62, EXT-FR-FE-85, EXT-FR-FE-108,
        EXT-FR-FE-131
      properties:
        contact_point:
          description: >-
            BT-41, BT-56, EXT-FR-FE-23, EXT-FR-FE-40, EXT-FR-FE-63,
            EXT-FR-FE-86, EXT-FR-FE-109, EXT-FR-FE-132


            A contact point for a legal entity or person.

            Such as person name, contact identification, department or office
            identification.
          type: string
        department_name:
          description: BT-41-0 Only in CII
          type: string
        email_address:
          description: >-
            BT-43, BT-58, EXT-FR-FE-25, EXT-FR-FE-42, EXT-FR-FE-65,
            EXT-FR-FE-88, EXT-FR-FE-111, EXT-FR-FE-134


            An e-mail address for the contact point.
          type: string
        phone_number:
          description: >-
            BT-42, BT-57, EXT-FR-FE-24, EXT-FR-FE-41, EXT-FR-FE-64,
            EXT-FR-FE-87, EXT-FR-FE-110, EXT-FR-FE-133


            A phone number for the contact point.
          type: string
      type: object
    convert_invoice_format:
      description: >-
        Invoice format can be


        1. `cii`: official format, defined as xml

        2. `ubl`: official format, defined as xml

        3. `en16931`: format defined in schema `en_invoice`, as json data.
        `factur-x` can be passed as input. It will be possible to pass it as
        output in the future.
      enum:
        - cii
        - ubl
        - en16931
        - factur-x
      type: string
    create_directory_entry:
      properties:
        directory:
          $ref: "#/components/schemas/directory"
        identifier:
          description: A Peppol address follows the format "scheme_id:participant_id", for
            example, "0225:853322915".
          example: 0225:853322915
          type: string
      required:
        - directory
        - identifier
      type: object
    credit_transfer:
      properties:
        payment_account_identifier:
          $ref: "#/components/schemas/credit_transfer_identifier"
        payment_account_name:
          description: >-
            BT-85


            The name of the payment account, at a payment service provider, to
            which payment should be made.
          type: string
        payment_service_provider_identifier:
          description: >-
            BT-86


            An identifier for the payment service provider where a payment
            account is located.

            Such as a BIC or a national clearing code where required. No
            identification scheme to be used.
          type: string
      required:
        - payment_account_identifier
      type: object
    credit_transfer_identifier:
      description: >-
        BT-84


        Payment account identifier

        A unique identifier of the financial payment account, at a payment
        service provider, to which payment should be made.

        Such as IBAN (in case of a SEPA payment) or a national account number.
      properties:
        scheme:
          type: string
        value:
          type: string
      required:
        - value
        - scheme
      type: object
    currency_code:
      description: >-
        BT-5


        Invoice currency code

        The currency in which all Invoice amounts are given, except for the
        Total VAT amount in accounting currency.

        Only one currency shall be used in the Invoice, except for the Invoice
        total VAT amount in accounting currency (BT-111) in accordance with
        article 230 of Directive 2006/112/EC on VAT [2]. The lists of valid
        currencies are registered with the ISO 4217 Maintenance Agency “Codes
        for the representation of currencies and funds”.


        BT-6


        VAT accounting currency code

        The currency used for VAT accounting and reporting purposes as accepted
        or required in the country of the Seller.

        Shall be used in combination with the Invoice total VAT amount in
        accounting currency (BT-111) when the VAT accounting currency code
        differs from the Invoice currency code. The lists of valid currencies
        are registered with the ISO 4217 Maintenance Agency “Codes for the
        representation of currencies and funds”. Please refer to Article 230 of
        the Council Directive 2006/112/EC [2] for more information.
      type: string
    delivery_information:
      description: >-
        BG-13


        A group of business terms providing information about where and when the
        goods and services invoiced are delivered.
      properties:
        deliver_to_name:
          description: |-
            BT-70

            Deliver to party name
            The name of the party to which the goods and services are delivered.
            Shall be used if the Deliver to party is different from the Buyer.
          type: string
        delivery_date:
          description: >-
            BT-72


            Actual delivery date

            the date on which the supply of goods or services was made or
            completed.
          format: date
          type: string
        delivery_identifier:
          description: >-
            BT-71


            Deliver to location identifier

            An identifier for the location at which the goods and services are
            delivered.

            If no scheme is specified, it should be known by Buyer and Seller,
            e.g. a previously exchanged Buyer or Seller assigned identifier.

            Scheme identifier

            The identification scheme identifier of the Deliver to location
            identifier.

            If used, the identification scheme shall be chosen from the entries
            of the list published by the ISO/IEC 6523 maintenance agency.
          items:
            $ref: "#/components/schemas/identifier"
          type: array
      type: object
    delivery_terms:
      description: |-
        EXT-FR-FE-BG-14

        Delivery terms - INCOTERMS
      properties:
        incoterms:
          description: >-
            EXT-FR-FE-185


            Code specifying the delivery type for these commercial delivery
            conditions.

            To be chosen from the entries in the list UNTDID 4053 + INCOTERMS

            1: Delivery arranged by the supplier (Indicates that the supplier
            will arrange delivery of the goods).

            2: Delivery arranged by logistic service provider (Code indicating
            that the logistic service provider has arranged the delivery of
            goods).

            CFR: Cost and Freight (insert named port of destination)

            CIF: Cost, Insurance and Freight (insert named port of destination)

            CIP: Carriage and Insurance Paid to (insert named place of
            destination)

            CPT: Carriage Paid To (insert named place of destination)

            DAP: Delivered At Place (insert named place of destination)

            DAT: Delivered At Terminal (insert named terminal at port or place
            of destination)

            DDP: Delivered Duty Paid (insert named place of destination)

            EXW: Ex Works (insert named place of delivery)

            FAS: Free Alongside Ship (insert named port of shipment)

            FCA: Free Carrier (insert named place of delivery)

            FOB: Free On Board (insert named port of shipment)
          type: string
        name:
          description: |-
            EXT-FR-FE-186

            Place of delivery. For example a harbour
          type: string
      type: object
    direct_debit:
      description: >-
        BG-19


        A group of business terms to specify a direct debit.

        This group may be used to give prior notice in the invoice that payment
        will be made through a SEPA or other direct debit initiated by the
        Seller, in accordance with the rules of the SEPA or other direct debit
        scheme.
      properties:
        bank_assigned_creditor_identifier:
          description: >-
            BT-90


            Bank assigned creditor identifier

            Unique banking reference identifier of the Payee or Seller assigned
            by the Payee or Seller bank.

            Used in order to pre-notify the Buyer of a SEPA direct debit.
          type: string
        debited_account_identifier:
          description: |-
            BT-91

            Debited account identifier
            The account to be debited by the direct debit.
          type: string
        mandate_reference_identifier:
          description: >-
            BT-89


            Mandate reference identifier

            Unique identifier assigned by the Payee for referencing the direct
            debit mandate.

            Used in order to pre-notify the Buyer of a SEPA direct debit.
          type: string
      type: object
    directory:
      enum:
        - peppol
        - ppf
      type: string
    directory_entry:
      properties:
        company:
          $ref: "#/components/schemas/company"
        created_at:
          format: date-time
          type: string
        directory:
          $ref: "#/components/schemas/directory"
        id:
          type: integer
        identifier:
          example: 0225:853322915
          type: string
        is_replyto:
          description: '"Reply-to" addresses are technical addresses used in the Peppol
            network to receive messages linked to a previously sent invoice.
            They should not be used as a recipient address to send an invoice.'
          type: boolean
        status:
          $ref: "#/components/schemas/directory_entry_status"
        status_message:
          type: string
      required:
        - company
        - created_at
        - directory
        - id
        - identifier
        - status
      type: object
    directory_entry_status:
      enum:
        - pending
        - created
        - error
      type: string
    electronic_address:
      description: >-
        BT-34, EXT-FR-FE-170


        Seller electronic address

        Identifies the Seller's electronic address to which the application
        level response to the invoice may be delivered.

        Scheme identifier

        The identification scheme identifier of the Seller electronic address.

        The scheme identifier shall be chosen from a list to be maintained by
        the Connecting Europe Facility.


        BT-49


        Buyer electronic address

        Identifies the Buyer's electronic address to which the invoice is
        delivered.

        Scheme identifier

        The identification scheme identifier of the Buyer electronic address.

        The scheme identifier shall be chosen from a list to be maintained by
        the Connecting Europe Facility.


        EXT-FR-FE-29, EXT-FR-FE-30, EXT-FR-FE-12, EXT-FR-FE-13, EXT-FR-FE-52,
        EXT-FR-FE-53, EXT-FR-FE-75, EXT-FR-FE-76, EXT-FR-FE-98, EXT-FR-FE-99,
        EXT-FR-FE-121, EXT-FR-FE-122


        EXT-FR-FE-29, EXT-FR-FE-30, EXT-FR-FE-12, EXT-FR-FE-13, EXT-FR-FE-52,
        EXT-FR-FE-53, EXT-FR-FE-75, EXT-FR-FE-76, EXT-FR-FE-98, EXT-FR-FE-99,
        EXT-FR-FE-121, EXT-FR-FE-122
      properties:
        scheme:
          type: string
        value:
          type: string
      required:
        - value
        - scheme
      type: object
    en_invoice:
      description: |-
        ENInvoice structure is following EN 16931 semantic model
        - Bibliography
        - [1]
        Directive 2014/55/EU of the European Parliament and of The Council of 16 April 2014 on
        electronic invoicing in public procurement [viewed 2015-07-26] Available from http://eur-
        lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014L0055.
        - [2]
        COUNCIL DIRECTIVE. 2006/112/EC of 28 November 2006 on the common system of value added
        tax – last version: 2006L0112 - EN - 01.01.2015 - 016.001 [viewed 2015-07-26] Available from
        http://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02006L0112-20150101.
        - [3]
        Directive 2011/7/EU of the European Parliament and of the Council of 16 February 2011 on
        combating late payment in commercial transactions [viewed 2015-07-26] Available from
        http://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32011L0007.
        - [4]
        Directive 95/46/EC of the European Parliament and of the Council of 24 October 1995 on the
        protection of individuals with regard to the processing of personal data and on the free
        movement of such data [viewed 2015-07-26]. Available from http://eur-lex.europa.eu/legal-
        content/EN/TXT/?uri=URISERV:l14012.
        - [5]
        COUNCIL DIRECTIVE. 2008/9/EC of 12 February 2008 laying down detailed rules for the refund of
        value added tax, provided for in Directive 2006/112/EC, to taxable persons not established in
        the Member State of refund but established in another Member State [viewed 2015-07-
        26]. Available from http://eur-lex.europa.eu/legal-
        content/EN/TXT/?uri=CELEX:32008L0009&qid=1437940645512.
        - [6]
        United Nations Trade Data Interchange Directory (UNTDID)
        http://www.unece.org/fileadmin/DAM/trade/untdid/d16b/tred/tredi2.htm
        - [7]
        UN/ECE Recommendation N° 20 “Codes for Units of Measure Used in International
        Trade” [viewed 2015-07-26]. Available from
        http://www.unece.org/fileadmin/DAM/cefact/recommendations/rec20/rec20_
        latest_08052015.zip.
        - [8]
        Regulation (EU) No 910/2014 of the European Parliament and of the Council of 23 July 2014 on
        electronic identification and trust services for electronic transactions in the internal market and
        repealing Directive 1999/93/EC [viewed 2015-07-26]. Available from http://eur-
        lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014R0910.
        - [9]
        European Interoperability Framework (EIF) for European public services [viewed 2015-07-26].
        Available from http://ec.europa.eu/isa/documents/isa_annex_ii_eif_en.pdf.
        - [10]
        ANNEX TO THE COMMISSION IMPLEMENTING DECISION C. (2014)7912 final of 10 December 2014 on a
        standardisation request to the European standardisation organizations as regards a European
        standard on electronic invoicing and a set of ancillary standardisation deliverables pursuant to
        Regulation (EU) No 1025/2012 of the European Parliament and of the Council [viewed 2015-07-
        26]. Available from
        http://ec.europa.eu/DocsRoom/documents/8650/attachments/1/translations/en/renditions/
        pdf.I.S. EN 16931-1:2017+A1:2019&AC:2020
        EN 16931-1:2017+A1:2019 (E)
        - [11]
        COUNCIL DIRECTIVE. 2008/118/EC concerning the general arrangements for excise duty and
        repealing Directive 92/12/EEC [viewed 2015-08-03]. Available from http://eur-
        lex.europa.eu/LexUriServ/LexUriServ.do?uri=OJ:L:2009:009:0012:0030:EN:PDF.
        - [12]
        Object Management Group - Business Process Model and Notation v2,
        http://www.omg.org/spec/BPMN/2.0/
        - [13]
        SEPA Credit Transfer Scheme Implementation Guide
        http://www.europeanpaymentscouncil.eu/index.cfm/knowledge-bank/epc-documents/sepa-
        credit-transfer-scheme-customer-to-bank-implementation-guidelines-version-8/epc132-08-
        c2b-ctig-v80-approvedpdf/
        - [14]
        SEPA Direct Debit Scheme Implementation Guide
        http://www.europeanpaymentscouncil.eu/index.cfm/knowledge-bank/epc-documents/sepa-
        direct-debit-core-scheme-customer-to-bank-implementation-guidelines-version-8/epc130-08-
        sdd-core-c2b-ig-v80-approvedpdf/
        - [15]
        CLARIFICATION E.P.C. Paper on the Use of Slashes in References, Identifications and Identifiers
        http://www.europeanpaymentscouncil.eu/index.cfm/knowledge-bank/epc-documents/sepa-
        credit-transfer-scheme-customer-to-bank-implementation-guidelines-version-8/epc230-15-
        clarification-paper-on-the-use-of-slashes-in-references-identifications-and-identifierspdf/
        - [16]
        http://www.iso.org/iso/catalogue_detail.htm?csnumber=50649
        - [17]
        http://www.eact.eu/docs/EACT_Standard_for_Remittance_Info.pdf
        - [18]
        TOGAF architecture compliance. Available from
        http://pubs.opengroup.org/architecture/togaf9-doc/arch/chap48.html
        - [19]
        UN/ECE Recommendation N°. 21 - Codes for Passengers, Types of Cargo, Packages and
        Packaging Materials (with Complementary Codes for Package Names)
        http://www.unece.org/fileadmin/DAM/cefact/recommendations/rec21/rec21.zip
        - [20]
        ISO 639-2, Codes for the representation of names of languages — Part 2: Alpha-3 code
      properties:
        additional_supporting_documents:
          description: >-
            BG-24


            A group of business terms providing information about additional
            supporting documents substantiating the claims made in the Invoice.

            The additional supporting documents can be used for both referencing
            a document number which is expected to be known by the receiver, an
            external document (referenced by a URL) or as an embedded document
            (such as a time report in pdf). The option to link to an external
            document will be needed, for example in the case of large
            attachments and/or when sensitive information, e.g. person-related
            services, has to be separated from the Invoice itself.
          items:
            $ref: "#/components/schemas/additional_supporting_document"
          type: array
        addressed_to:
          $ref: "#/components/schemas/extension_contact"
        buyer:
          $ref: "#/components/schemas/buyer"
        buyer_accounting_reference:
          description: >-
            BT-19


            Buyer accounting reference

            A textual value that specifies where to book the relevant data into
            the Buyer's financial accounts.
          type: string
        buyer_agent:
          $ref: "#/components/schemas/extension_contact"
        buyer_reference:
          description: >-
            BT-10


            Buyer reference

            An identifier assigned by the Buyer used for internal routing
            purposes.

            The identifier is defined by the Buyer (e.g. contact ID, department,
            office id, project code), but provided by the Seller in the Invoice.
          type: string
        charges:
          description: >-
            BG-21


            A group of business terms providing information about charges and
            taxes other than VAT, applicable to the Invoice as a whole.
          items:
            $ref: "#/components/schemas/invoice_allowance_or_charge"
          type: array
        contract_reference:
          description: >-
            BT-12


            Contract reference

            The identification of a contract.

            The contract identifier should be unique in the context of the
            specific trading relationship and for a defined time period.
          type: string
        contract_type:
          description: |-
            EXT-FR-FE-01

            Type de contrat
          type: string
        currency_code:
          $ref: "#/components/schemas/currency_code"
        deliver_to_address:
          $ref: "#/components/schemas/postal_address"
        delivery_information:
          $ref: "#/components/schemas/delivery_information"
        delivery_terms:
          $ref: "#/components/schemas/delivery_terms"
        despatch_advice_reference:
          description: |-
            BT-16

            Despatch advice reference
            An identifier of a referenced despatch advice.
          type: string
        document_level_allowances:
          description: >-
            BG-20


            A group of business terms providing information about allowances
            applicable to the Invoice as a whole.

            Deductions, such as withheld tax may also be specified in this
            group.
          items:
            $ref: "#/components/schemas/invoice_allowance_or_charge"
          type: array
        invoiced_object_identifier_scheme:
          deprecated: true
          description: >-
            BT-18-1


            Scheme identifier

            The identification scheme identifier of the Invoiced object
            identifier.

            If it may be not clear for the receiver what scheme is used for the
            identifier, a conditional scheme identifier should be used that
            shall be chosen from the UNTDID 1153 code list [6] entries.

            Deprecated: Use InvoicedObjectIdentifiers instead
          type: string
        invoiced_object_identifier_value:
          deprecated: true
          description: >-
            BT-18


            Invoiced object identifier

            An identifier for an object on which the invoice is based, given by
            the Seller.

            It may be a subscription number, telephone number, meter point,
            vehicle, person etc., as applicable.

            Deprecated: Use InvoicedObjectIdentifiers instead
          type: string
        invoiced_object_identifiers:
          description: >-
            BT-18


            InvoicedObjectIdentifiers

            A list of identifers for objets on which the invoice is based, given
            by the Seller.

            Each object is composed of a value and a scheme

            - Value : It may be a susbscription number, telephone number, meter
            point, vehiclen person etc., as applicable.

            - Scheme: If it may be not clear for the receiver what scheme is
            used for the identifier, a conditional scheme identifier should be
            used that shall be chosen from the UNTDID 1153 code list [6]
            entries.
          items:
            $ref: "#/components/schemas/invoiced_object_identifier"
          type: array
        invoicing_period:
          $ref: "#/components/schemas/invoicing_period"
        issue_date:
          description: |-
            BT-2

            Invoice issue date
            The date when the Invoice was issued.
          format: date
          type: string
        lines:
          description: >-
            BG-25


            A group of business terms providing information on individual
            Invoice lines.
          items:
            $ref: "#/components/schemas/invoice_line"
          type: array
        notes:
          description: >-
            BG-1


            A group of business terms providing textual notes that are relevant
            for the invoice, together with an indication of the note subject
          items:
            $ref: "#/components/schemas/invoice_note"
          type: array
        number:
          description: >-
            BT-1


            Invoice number

            A unique identification of the Invoice.

            The sequential number required in Article 226(2) of the directive
            2006/112/EC [2], to uniquely identify the Invoice within the
            business context, time-frame, operating systems and records of the
            Seller. It may be based on one or more series of numbers, which may
            include alphanumeric characters. No identification scheme is to be
            used.
          type: string
        payee:
          $ref: "#/components/schemas/payee"
        payer:
          $ref: "#/components/schemas/extension_contact"
        payment_due_date:
          description: >-
            BT-9


            Payment due date

            The date when the payment is due.

            The payment due date reflects the due date of the net payment. For
            partial payments it states the first net due date. The corresponding
            description of more complex payment terms can be stated in BT-20
            Payment terms.
          format: date
          type: string
        payment_instructions:
          $ref: "#/components/schemas/payment_instructions"
        payment_terms:
          description: >-
            BT-20


            Payment terms

            A textual description of the payment terms that apply to the amount
            due for payment (Including description of possible penalties).

            This element may contain multiple lines and multiple terms.
          type: string
        preceding_invoice_references:
          description: >-
            BG-3


            A group of business terms providing information on one or more
            preceding Invoices.

            To be used in case:

            - a preceding invoice is corrected

            - preceding partial invoices are referred to from a final invoice

            - preceding pre-payment invoices are referred to from a final
            invoice
          items:
            $ref: "#/components/schemas/preceding_invoice_reference"
          type: array
        process_control:
          $ref: "#/components/schemas/process_control"
        project_reference:
          description: |-
            BT-11

            Project reference
            The identification of the project the invoice refers to
          type: string
        purchase_order_reference:
          description: |-
            BT-13

            Purchase order reference
            An identifier of a referenced purchase order, issued by the Buyer.
          type: string
        receiving_advice_reference:
          description: |-
            BT-15

            Receiving advice reference
            An identifier of a referenced receiving advice.
          type: string
        sales_order_reference:
          description: |-
            BT-14

            Sales order reference
            An identifier of a referenced sales order, issued by the Seller.
          type: string
        seller:
          $ref: "#/components/schemas/seller"
        seller_agent:
          $ref: "#/components/schemas/extension_contact"
        seller_tax_representative_party:
          $ref: "#/components/schemas/seller_tax_representative_party"
        tender_or_lot_reference:
          description: >-
            BT-17


            Tender or lot reference

            The identification of the call for tender or lot the invoice relates
            to.

            In some countries a reference to the call for tender that has led to
            the contract shall be provided.
          type: string
        third_party_biller:
          $ref: "#/components/schemas/extension_contact"
        totals:
          $ref: "#/components/schemas/totals"
        type_code:
          $ref: "#/components/schemas/invoice_type_code"
        vat_accounting_currency_code:
          $ref: "#/components/schemas/currency_code"
        vat_break_down:
          description: >-
            BG-23


            A group of business terms providing information about VAT breakdown
            by different categories, rates and exemption reasons
          items:
            $ref: "#/components/schemas/vat_break_down"
          type: array
        vat_point_date:
          description: >-
            BT-7


            Value added tax point date

            The date when the VAT becomes accountable for the Seller and for the
            Buyer in so far as that date can be determined and differs from the
            date of issue of the invoice, according to the VAT directive.

            The tax point is usually the date goods were supplied or services
            completed (the 'basic tax point'). There are some variations. Please
            refer to Article 226 (7) of the Council Directive 2006/112/EC [2]
            for more information. This element is required if the Value added
            tax point date is different from the Invoice issue date. Both Buyer
            and Seller should use the Tax Point Date when provided by the
            Seller. The use of BT-7 and BT-8 is mutually exclusive.
          format: date
          type: string
        vat_point_date_code:
          description: >-
            BT-8


            Value added tax point date code

            The code of the date when the VAT becomes accountable for the Seller
            and for the Buyer.

            The code shall distinguish between the following entries of UNTDID
            2005 [6]: - Invoice document issue date - Delivery date, actual -
            Paid to dateThe Value added tax point date code is used if the Value
            added tax point date is not known when the invoice is issued. The
            use of BT-8 and BT-7 is mutually exclusive.
          type: string
      required:
        - number
        - issue_date
        - type_code
        - currency_code
        - process_control
        - seller
        - buyer
        - totals
        - vat_break_down
        - lines
      type: object
